[tox]
envlist = test, lint, format, types, docs-test, docs-build, prek

[testenv]
runner = uv-venv-lock-runner

[testenv:test]
dependency_groups =
    test
commands =
    pytest tests \
        --durations=10 \
        --capture=no \
        {posargs}

[testenv:coverage]
dependency_groups =
    test
commands =
    coverage run -m pytest \
        --durations=0 \
        --capture=no \
        {posargs}
    coverage xml

[testenv:lint]
description = Run code linter
skip_install = True
dependency_groups = quality
commands = ruff check src/ tests/ docs/

[testenv:format]
description = Run code formatter
skip_install = True
dependency_groups = quality
commands = ruff format --diff src/ tests/ docs/

[testenv:types]
dependency_groups =
    types
commands =
    ty check src --output-format concise

[testenv:docs-test]
description = Test documentation code snippets
dependency_groups =
    test
commands =
    pytest --codeblocks docs/ {posargs}

[testenv:docs-build]
description = Build the documentation
dependency_groups =
    docs
commands =
    zensical build {posargs}

[testenv:prek]
description = Pre-commit checks
dependency_groups = prek
commands = prek run --all-files
